name: Ingest YouTube request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'requests/**'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install project and ingestion dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[youtube]'
          yt-dlp --version

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          REQUEST_FILE="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'requests/*.txt' | grep -v '\.transcript-url\.txt$' | head -n 1)"
          test -n "$REQUEST_FILE"
          URL="$(head -n 1 "$REQUEST_FILE" | tr -d '\r\n')"
          VIDEO_ID="$(printf '%s' "$URL" | sed -E 's#.*(v=|youtu\.be/|shorts/|embed/)([A-Za-z0-9_-]{11}).*#\2#')"
          [[ "$VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]]
          echo "request_file=$REQUEST_FILE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"

      - name: Full multimodal ingestion
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p run-output/evidence
          yt-systems ingest "${{ steps.request.outputs.url }}" --out run-output/evidence 2>&1 | tee run-output/full-ingest.log
          EVIDENCE_DIR="$(find run-output/evidence -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$EVIDENCE_DIR"
          yt-systems timeline "$EVIDENCE_DIR" 2>&1 | tee run-output/timeline.log
          echo "$EVIDENCE_DIR" > run-output/evidence-dir.txt

      - name: Transcript fallback when full ingestion is blocked
        if: steps.full.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          VIDEO_ID="${{ steps.request.outputs.video_id }}"
          EVIDENCE_DIR="run-output/evidence/$VIDEO_ID"
          mkdir -p "$EVIDENCE_DIR"
          curl -fL --retry 3 --retry-delay 2 "https://youtube-transcript.ai/transcript/$VIDEO_ID.txt" -o "$EVIDENCE_DIR/transcript.md"
          curl -fL --retry 3 --retry-delay 2 "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$VIDEO_ID&format=json" -o "$EVIDENCE_DIR/oembed.json" || true
          jq -n --arg source "${{ steps.request.outputs.url }}" '{source_url:$source,ingestion_status:"transcript_fallback",scene_frames:0,multimodal:false,reason:"Full yt-dlp/FFmpeg ingestion failed on GitHub runner; transcript captured from hosted caption endpoint."}' > "$EVIDENCE_DIR/ingestion.json"
          echo "$EVIDENCE_DIR" > run-output/evidence-dir.txt

      - name: Record acceptance result
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$(cat run-output/evidence-dir.txt)"
          find "$EVIDENCE_DIR" -type f -printf '%P\n' | sort | jq -R -s 'split("\n")[:-1]' > run-output/files.json
          jq -n --arg full "${{ steps.full.outcome }}" --arg dir "$EVIDENCE_DIR" --argjson files "$(cat run-output/files.json)" '{full_ingestion_step:$full,evidence_dir:$dir,files:$files}' > run-output/acceptance.json
          cat run-output/acceptance.json

      - name: Upload ingestion evidence
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ingestion-${{ steps.request.outputs.video_id }}
          path: run-output/
          if-no-files-found: error
          retention-days: 7
